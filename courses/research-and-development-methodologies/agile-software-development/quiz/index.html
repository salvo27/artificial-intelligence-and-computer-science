<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulatore ASD</title>
<style>
[hidden] { display: none !important; }
html, body { margin: 0; }
img { max-width: 100%; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: an exam-sheet single column (max 780px) with a sticky header for timer and progress; start, question and result screens swap in place. */
:root {
  --bg: #eef1f5; --paper: #ffffff; --ink: #17202b; --muted: #5d6877; --line: #d4dbe4; --soft: #f5f7fa;
  --accent: #2f5bd3; --ok: #1d8a52; --ok-bg: #e5f5ec; --ko: #c43b3b; --ko-bg: #fbe9e9; --warn: #b26a00;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1318; --paper: #182029; --ink: #e7ebf1; --muted: #9ba6b5; --line: #334050; --soft: #1f2833;
  --accent: #86a6ff; --ok: #4cc488; --ok-bg: #16332a; --ko: #f07a7a; --ko-bg: #3a1e22; --warn: #f0b04a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0f1318; --paper: #182029; --ink: #e7ebf1; --muted: #9ba6b5; --line: #334050; --soft: #1f2833;
  --accent: #86a6ff; --ok: #4cc488; --ok-bg: #16332a; --ko: #f07a7a; --ko-bg: #3a1e22; --warn: #f0b04a; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 60px; }
h1 { font-family: var(--font-display); font-size: clamp(1.7rem, 4vw, 2.3rem); margin: 0 0 4px; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 0 0 10px; }
.muted { color: var(--muted); }
a { color: var(--accent); }
.links { margin: 6px 0 0; font-weight: 600; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.stack { display: grid; gap: 14px; }
.stack > * { min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 10px 16px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { max-width: 100%; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .85rem; color: var(--muted); }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg); padding-block: 8px; margin-bottom: 10px; }
.bar .row { justify-content: space-between; }
.timer { font-family: var(--font-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--ko); }
.prog { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.score-live { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.q { font-size: 1.15rem; font-weight: 600; margin: 6px 0 14px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; font-weight: 400; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.opt .k { font-family: var(--font-mono); color: var(--muted); min-width: 1.2em; }
.opt:disabled { opacity: 1; cursor: default; }
.opt.picked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--paper)); }
.opt.missed { border-style: dashed; }
.opt .box { font-size: 1.1rem; line-height: 1.3; }
.opt em { color: var(--muted); font-style: normal; font-size: .9em; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.ko { border-color: var(--ko); background: var(--ko-bg); }
.fb { margin-top: 12px; border-radius: 10px; padding: 12px 14px; }
.fb.ok { background: var(--ok-bg); } .fb.ko { background: var(--ko-bg); }
.fb strong { display: block; margin-bottom: 2px; }
textarea { width: 100%; min-height: 160px; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); resize: vertical; }
.points { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.points label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.topics { display: grid; gap: 6px; }
.trow { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: .92rem; }
.tbar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.tbar i { display: block; height: 100%; }
.trow b { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
details.wrong { border-top: 1px solid var(--line); padding: 8px 0; }
details.wrong summary { cursor: pointer; }
.big { font-family: var(--font-display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 9px 12px; border-radius: 9px; text-align: center; }
.tabs button small { display: block; font-weight: 400; font-size: .8rem; }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.tabs button[aria-selected="true"] small { color: var(--accent); }
.part h2 { font-size: 1.1rem; margin: 4px 0 10px; }
.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.chap { text-align: left; font-weight: 400; display: grid; gap: 3px; align-content: start; padding: 12px 14px; }
.chap b { font-family: var(--font-display); font-size: 1.05rem; line-height: 1.25; }
.chap .muted { font-size: .85rem; }
.chap:hover { border-color: var(--accent); }
.cbar { display: block; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 5px; }
.cbar i { display: block; height: 100%; }
/* the book tab uses its own accent, so it is clear which section you are in */
.wrap[data-tab="book"] { --accent: #b4532a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wrap[data-tab="book"] { --accent: #f0a274; } }
:root[data-theme="dark"] .wrap[data-tab="book"] { --accent: #f0a274; }
@media (max-width: 520px) { .trow { grid-template-columns: minmax(0, 1fr) 54px; } .trow .tbar { grid-column: 1 / -1; grid-row: 2; } }
@media (prefers-reduced-motion: reduce) { .prog i { transition: none; } }
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<script src="questions.js"></script>
<script src="book.js"></script>
<script>
const TOPICS = {
  intro: "Introduzione a Scrum", princ: "Principi agili", framework: "Framework e ruoli", sprints: "Sprint e DoD",
  req: "Requisiti e user story", backlog: "Product backlog", est: "Stima e velocity", debt: "Technical debt",
  plan: "Livelli di pianificazione", splan: "Sprint planning", sexec: "Sprint execution", review: "Sprint review",
  retro: "Retrospective", cicd: "Lab 1: CI/CD", test: "Lab 2: Testing",
};
const HAS_BOOK = typeof BOOK_MC !== "undefined";
const LABELS = { ...TOPICS, ...(HAS_BOOK ? BOOK_TOPICS : {}) };
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const toMc = pre => ([t, q, o, e]) => ({ id: pre + hash(q), t, q, o, e, nOk: 1 });
const toMulti = pre => ([t, q, ok, ko, e]) => ({ id: pre + hash(q), t, q, o: [...ok, ...ko], e, nOk: ok.length, multi: true });
const toOpen = pre => ([t, q, p]) => ({ id: pre + hash(q), t, q, p });
// exam pool (slides and labs)
const mcBank = [...MC.map(toMc("m")), ...(typeof MULTI === "undefined" ? [] : MULTI).map(toMulti("m"))];
const nMulti = mcBank.filter(q => q.multi).length;
const openBank = OPEN.map(toOpen("o"));
// separate pool: Rubin's book, chapter by chapter
const bookMc = HAS_BOOK ? [...BOOK_MC.map(toMc("bm")), ...BOOK_MULTI.map(toMulti("bm"))] : [];
const bookOpen = HAS_BOOK ? BOOK_OPEN.map(toOpen("bo")) : [];
const byId = Object.fromEntries([...mcBank, ...openBank, ...bookMc, ...bookOpen].map(x => [x.id, x]));

// per-viewer memory: how many times each question was shown, and the last wrong answers
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let seen = store.get("asdq-seen", {});
let wrongIds = store.get("asdq-wrong", []);
let history = store.get("asdq-history", []);

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// pick n questions: proportional to topic size, least-seen first, random among equals
function pick(bank, n) {
  n = Math.min(n, bank.length);
  const groups = {};
  for (const q of bank) (groups[q.t] ||= []).push(q);
  const order = q => (seen[q.id] || 0) + Math.random() * 0.5;
  for (const t in groups) groups[t].sort((a, b) => order(a) - order(b));
  const quota = {}; let given = 0;
  for (const t in groups) { quota[t] = Math.floor(n * groups[t].length / bank.length); given += quota[t]; }
  const rest = Object.keys(groups).sort((a, b) => (n * groups[b].length / bank.length % 1) - (n * groups[a].length / bank.length % 1));
  for (let i = 0; given < n; i = (i + 1) % rest.length) { if (quota[rest[i]] < groups[rest[i]].length) { quota[rest[i]]++; given++; } }
  let out = [];
  for (const t in groups) out = out.concat(groups[t].slice(0, quota[t]));
  return shuffle(out);
}

const app = document.getElementById("app");
let S = null; // session
let tick = null;

// two tabs on the same page: the exam simulator (slides and labs) and the book, each with its own errors and history
const isBook = id => id.startsWith("b"); // course ids start with m/o, book ids with bm/bo
const PARTS = [
  ["Introduzione", ["b01"]], ["Parte I · Core Concepts", ["b02", "b03", "b04", "b05", "b06", "b07", "b08"]],
  ["Parte II · Roles", ["b09", "b10", "b11", "b12", "b13"]], ["Parte III · Planning", ["b14", "b15", "b16", "b17", "b18"]],
  ["Parte IV · Sprinting", ["b19", "b20", "b21", "b22"]], ["Conclusione", ["b23"]],
];
let chapterStats = store.get("asdq-chapters", {}); // last result of each book chapter
let tab = (() => {
  if (!HAS_BOOK) return "exam";
  if (location.hash === "#libro") return "book";
  if (location.hash === "#esame") return "exam";
  return store.get("asdq-tab", "exam") === "book" ? "book" : "exam";
})();
const tabWrong = () => wrongIds.filter(id => byId[id] && isBook(id) === (tab === "book"));
const tabHistory = () => history.filter(h => !!h.book === (tab === "book"));
const col = v => v >= .8 ? "var(--ok)" : v >= .6 ? "var(--warn)" : "var(--ko)";

function setTab(t) {
  tab = t; store.set("asdq-tab", tab);
  try { window.history.replaceState(null, "", "#" + (tab === "book" ? "libro" : "esame")); } catch (e) {}
  startScreen();
}
function tabsHtml() {
  if (!HAS_BOOK) return "";
  const b = (t, name, sub) => `<button role="tab" aria-selected="${tab === t}" data-tab="${t}">${name}<small>${sub}</small></button>`;
  return `<nav class="tabs" role="tablist" aria-label="Sezioni">${b("exam", "Esame", "slide e laboratori")}${b("book", "Libro", "Essential Scrum, per capitolo")}</nav>`;
}
function lastRuns() {
  const last = tabHistory().slice(-3).reverse();
  return last.length ? `<div class="card"><h2>${tab === "book" ? "Ultime sessioni sul libro" : "Ultime simulazioni"}</h2>${last.map(h => `<div class="row" style="justify-content:space-between"><span>${h.date} · ${h.label}</span><b>${h.mc}${h.open != null ? ` · aperte ${h.open}` : ""}</b></div>`).join("")}</div>` : "";
}
function resetButton(label) {
  return `<button id="reset">${label}</button>`;
}
function bindCommon() {
  app.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { if (b.dataset.tab !== tab) setTab(b.dataset.tab); }));
  document.getElementById("reset").addEventListener("click", e => {
    if (!e.target.dataset.sure) { e.target.dataset.sure = "1"; e.target.textContent = "Clicca di nuovo per confermare"; return; }
    const mine = id => isBook(id) === (tab === "book");
    for (const id of Object.keys(seen)) if (mine(id)) delete seen[id];
    wrongIds = wrongIds.filter(id => !mine(id));
    history = history.filter(h => !!h.book !== (tab === "book"));
    if (tab === "book") chapterStats = {};
    store.set("asdq-seen", seen); store.set("asdq-wrong", wrongIds); store.set("asdq-history", history); store.set("asdq-chapters", chapterStats);
    startScreen();
  });
}

function startScreen() {
  clearInterval(tick);
  app.dataset.tab = tab;
  if (tab === "book") bookScreen(); else examScreen();
  bindCommon();
}

function examScreen() {
  const unseenMc = mcBank.filter(q => !seen[q.id]).length;
  const unseenOpen = openBank.filter(q => !seen[q.id]).length;
  const nWrong = tabWrong().length;
  app.innerHTML = `
  <div class="stack">
    ${tabsHtml()}
    <div>
      <div class="tag">Agile Software Development · test intermedio</div>
      <h1>Simulatore d'esame</h1>
      <p class="muted">Domande sulle slide di Scrum (Rubin) e sui laboratori CI/CD e testing, con le risposte del corso. A ogni avvio vengono scelte prima le domande che non hai ancora visto, distribuite su tutti gli argomenti. Le domande sono in inglese come le slide, le spiegazioni in italiano.</p>
      <p class="links"><a href="map.html">Mappa di Scrum</a> · <a href="https://github.com/salvo27/artificial-intelligence-and-computer-science/blob/main/courses/research-and-development-methodologies/agile-software-development/summary.md">Riassunto del corso</a> · <a href="https://github.com/salvo27/artificial-intelligence-and-computer-science">Repository</a></p>
    </div>
    <div class="card stack">
      <div class="stats">
        <div class="stat"><b>${mcBank.length}</b><span>domande chiuse, di cui ${nMulti} con più risposte giuste</span></div>
        <div class="stat"><b>${openBank.length}</b><span>domande aperte</span></div>
        <div class="stat"><b>${unseenMc} + ${unseenOpen}</b><span>ancora mai viste</span></div>
        <div class="stat"><b>${nWrong}</b><span>errori da ripassare</span></div>
      </div>
      <div class="row">
        <label for="mode">Formato</label>
        <select id="mode">
          <option value="exam">Esame completo: 100 multiple + 20 aperte, 2 ore</option>
          <option value="half">Metà esame: 50 multiple + 10 aperte, 1 ora</option>
          <option value="quick">Allenamento veloce: 20 multiple + 3 aperte, senza timer</option>
          <option value="mconly">Solo chiuse: 100 domande, 1 ora e 30</option>
          <option value="openonly">Solo aperte: 20 domande, senza timer</option>
          <option value="openall">Solo aperte: tutte le ${openBank.length}, senza timer</option>
          <option value="topic">Un solo argomento, senza timer</option>
        </select>
        <select id="topic" hidden>${Object.entries(TOPICS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
      </div>
      <div class="row">
        <button class="primary" id="go">Inizia</button>
        <button id="redo" ${nWrong ? "" : "disabled"}>Ripassa i ${nWrong} errori</button>
        ${resetButton("Azzera lo storico")}
      </div>
      <p class="muted" style="margin:0;font-size:.9rem">Le risposte multiple sono corrette subito. Per le aperte scrivi la risposta, poi confrontala con i punti chiave e spunta quelli che hai toccato. Nelle domande «choose two/three» seleziona tutte le risposte e premi Conferma: valgono solo se sono tutte giuste. Tasti numerici per rispondere, Invio per confermare e andare avanti.</p>
    </div>
    ${lastRuns()}
  </div>`;
  const mode = document.getElementById("mode"), topic = document.getElementById("topic");
  mode.addEventListener("change", () => { topic.hidden = mode.value !== "topic"; });
  document.getElementById("go").addEventListener("click", () => begin(mode.value, topic.value));
  document.getElementById("redo").addEventListener("click", () => begin("wrong"));
}

function bookScreen() {
  const nWrong = tabWrong().length;
  const unseen = [...bookMc, ...bookOpen].filter(q => !seen[q.id]).length;
  const count = t => bookMc.filter(q => q.t === t).length + bookOpen.filter(q => q.t === t).length;
  const card = t => {
    const [num, name] = BOOK_TOPICS[t].replace(/^Libro cap\. /, "").split(/: (.*)/);
    const s = chapterStats[t];
    return `<button class="chap" data-ch="${t}"><span class="tag">Capitolo ${num}</span><b>${esc(name)}</b>
      <span class="muted">${count(t)} domande · ${s ? `ultima volta ${s.ok}/${s.tot}` : "da fare"}</span>
      <span class="cbar"><i style="width:${s ? s.ok / s.tot * 100 : 0}%;background:${s ? col(s.ok / s.tot) : "transparent"}"></i></span></button>`;
  };
  app.innerHTML = `
  <div class="stack">
    ${tabsHtml()}
    <div>
      <div class="tag">Kenneth S. Rubin · Essential Scrum (Addison-Wesley, 2012)</div>
      <h1>Domande sul libro</h1>
      <p class="muted">Domande capitolo per capitolo sul libro di testo del corso, con le risposte secondo il libro. Sono separate dalle simulazioni d'esame, che seguono le slide: il libro va oltre (ruoli in dettaglio, manager, strutture dei team, portfolio, envisioning, release planning), quindi usale per approfondire. Errori e storico di questo tab sono separati da quelli dell'esame.</p>
    </div>
    <div class="card stack">
      <div class="stats">
        <div class="stat"><b>${bookMc.length}</b><span>domande chiuse, di cui ${bookMc.filter(q => q.multi).length} con più risposte giuste</span></div>
        <div class="stat"><b>${bookOpen.length}</b><span>domande aperte</span></div>
        <div class="stat"><b>${unseen}</b><span>ancora mai viste</span></div>
        <div class="stat"><b>${nWrong}</b><span>errori da ripassare</span></div>
      </div>
      <div class="row">
        <button class="primary" data-go="bookquiz">Mix di tutti i capitoli: 30 chiuse + 5 aperte</button>
        <button data-go="bookall">Tutte le ${bookMc.length} chiuse</button>
        <button data-go="bookopen">Tutte le ${bookOpen.length} aperte</button>
        <button data-go="wrong" ${nWrong ? "" : "disabled"}>Ripassa i ${nWrong} errori</button>
      </div>
    </div>
    ${PARTS.map(([name, chs]) => `<section class="part"><h2>${name}</h2><div class="chapters">${chs.map(card).join("")}</div></section>`).join("")}
    ${lastRuns()}
    <div class="row">${resetButton("Azzera lo storico del libro")}</div>
  </div>`;
  app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => begin(b.dataset.go)));
  app.querySelectorAll("[data-ch]").forEach(b => b.addEventListener("click", () => begin("bookch", b.dataset.ch)));
}

function begin(mode, topic) {
  let mc = [], op = [], minutes = 0, label = "";
  if (mode === "exam") { mc = pick(mcBank, 100); op = pick(openBank, 20); minutes = 120; label = "Esame completo"; }
  if (mode === "half") { mc = pick(mcBank, 50); op = pick(openBank, 10); minutes = 60; label = "Metà esame"; }
  if (mode === "quick") { mc = pick(mcBank, 20); op = pick(openBank, 3); label = "Allenamento veloce"; }
  if (mode === "mconly") { mc = pick(mcBank, 100); minutes = 90; label = "Solo chiuse"; }
  if (mode === "openonly") { op = pick(openBank, 20); label = "Solo domande aperte"; }
  if (mode === "openall") { op = pick(openBank, openBank.length); label = "Tutte le domande aperte"; }
  if (mode === "topic") { mc = pick(mcBank.filter(q => q.t === topic), 999); op = pick(openBank.filter(q => q.t === topic), 999); label = TOPICS[topic]; }
  if (mode === "bookquiz") { mc = pick(bookMc, 30); op = pick(bookOpen, 5); label = "Libro: mix di tutti i capitoli"; }
  if (mode === "bookall") { mc = pick(bookMc, bookMc.length); label = "Libro: tutte le chiuse"; }
  if (mode === "bookopen") { op = pick(bookOpen, bookOpen.length); label = "Libro: tutte le aperte"; }
  if (mode === "bookch") { mc = pick(bookMc.filter(q => q.t === topic), 999); op = pick(bookOpen.filter(q => q.t === topic), 999); label = LABELS[topic]; }
  if (mode === "wrong") { mc = shuffle(tabWrong().map(id => byId[id])); label = tab === "book" ? "Libro: ripasso errori" : "Ripasso errori"; }
  if (!mc.length && !op.length) { startScreen(); return; }
  const items = [...mc.map(q => ({ kind: "mc", q, opts: shuffle(q.o.map((text, i) => ({ text, ok: i < q.nOk }))), sel: [] })), ...op.map(q => ({ kind: "open", q, text: "", checks: [], revealed: false }))];
  for (const it of items) seen[it.q.id] = (seen[it.q.id] || 0) + 1;
  store.set("asdq-seen", seen);
  S = { items, i: 0, label, mode, topic, book: tab === "book", end: minutes ? Date.now() + minutes * 60000 : null };
  if (S.end) { tick = setInterval(updateTimer, 1000); }
  render();
}

function fmt(ms) { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}`; }
function updateTimer() {
  const el = document.getElementById("timer"); if (!el || !S) return;
  const left = S.end - Date.now();
  el.textContent = "⏱ " + fmt(left);
  el.classList.toggle("low", left < 10 * 60000);
  if (left <= 0) { clearInterval(tick); finish(true); }
}
function isRight(x) {
  if (x.answer == null) return false;
  const chosen = Array.isArray(x.answer) ? x.answer : [x.answer];
  return chosen.length === x.q.nOk && chosen.every(k => x.opts[k].ok);
}
function rightText(x) { return x.opts.filter(o => o.ok).map(o => o.text).join(" · "); }
function chosenText(x) { const c = Array.isArray(x.answer) ? x.answer : [x.answer]; return c.map(k => x.opts[k].text).join(" · "); }
function liveScore() {
  const done = S.items.filter(x => x.kind === "mc" && x.answer != null);
  const ok = done.filter(isRight).length;
  return `${ok} giuste su ${done.length} risposte`;
}

function render() {
  const it = S.items[S.i], n = S.items.length;
  const head = `<header class="bar"><div class="row"><span><b>${S.i + 1}</b> / ${n} · ${S.label}</span>
    <span class="score-live">${liveScore()}</span>
    ${S.end ? `<span class="timer" id="timer">⏱ ${fmt(S.end - Date.now())}</span>` : ""}
    <button id="stop">Termina</button></div><div class="prog"><i style="width:${(S.i) / n * 100}%"></i></div></header>`;
  let body = "";
  if (it.kind === "mc") {
    const answered = it.answer != null;
    const chosen = answered ? (Array.isArray(it.answer) ? it.answer : [it.answer]) : it.sel;
    const right = answered && isRight(it);
    body = `<div class="card"><div class="tag">${LABELS[it.q.t]} · ${it.q.multi ? `scegli ${it.q.nOk} risposte` : "risposta singola"}</div><div class="q">${esc(it.q.q)}</div>
      <div class="opts">${it.opts.map((o, k) => {
        let cls = "", note = "";
        const picked = chosen.includes(k);
        if (answered) {
          if (o.ok && picked) cls = "ok";
          else if (o.ok) { cls = "ok missed"; note = it.q.multi ? " <em>(non selezionata)</em>" : ""; }
          else if (picked) cls = "ko";
        } else if (picked) cls = "picked";
        const box = it.q.multi ? `<span class="box">${picked ? "☑" : "☐"}</span>` : "";
        return `<button class="opt ${cls}" data-k="${k}" ${answered ? "disabled" : ""} aria-pressed="${picked}"><span class="k">${k + 1}</span>${box}<span>${esc(o.text)}${note}</span></button>`;
      }).join("")}</div>
      ${!answered && it.q.multi ? `<div class="row" style="margin-top:10px"><button class="primary" id="confirm" ${it.sel.length === it.q.nOk ? "" : "disabled"}>Conferma (${it.sel.length}/${it.q.nOk})</button></div>` : ""}
      ${answered ? (right
        ? `<div class="fb ok"><strong>Giusto.</strong>${esc(it.q.e)}</div>`
        : `<div class="fb ko"><strong>Sbagliato. ${it.q.multi ? "Le risposte giuste sono" : "La risposta giusta è"}: ${esc(rightText(it))}</strong>${esc(it.q.e)}</div>`) : ""}
      </div>`;
  } else {
    body = `<div class="card stack"><div><div class="tag">${LABELS[it.q.t]} · domanda aperta</div><div class="q">${esc(it.q.q)}</div></div>
      <textarea id="ans" placeholder="Scrivi la tua risposta come all'esame…">${esc(it.text)}</textarea>
      ${it.revealed ? `<div><b>Punti chiave di una risposta completa.</b> <span class="muted">Spunta quelli che hai toccato.</span>
        <ul class="points">${it.q.p.map((p, k) => `<li><label><input type="checkbox" data-c="${k}" ${it.checks[k] ? "checked" : ""}> <span>${esc(p)}</span></label></li>`).join("")}</ul></div>`
        : `<div><button id="reveal">Mostra la soluzione</button></div>`}
    </div>`;
  }
  const canNext = it.kind === "open" || it.answer != null;
  app.innerHTML = head + body + `<div class="row" style="margin-top:14px;justify-content:space-between">
    <button id="prev" ${S.i ? "" : "disabled"}>Indietro</button>
    <button class="primary" id="next" ${canNext ? "" : "disabled"}>${S.i === n - 1 ? "Vedi il risultato" : "Avanti"}</button></div>`;
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(+b.dataset.k)));
  const cf = document.getElementById("confirm"); if (cf) cf.addEventListener("click", confirmMulti);
  const ta = document.getElementById("ans"); if (ta) ta.addEventListener("input", () => { it.text = ta.value; });
  const rv = document.getElementById("reveal"); if (rv) rv.addEventListener("click", () => { it.revealed = true; render(); });
  app.querySelectorAll("[data-c]").forEach(c => c.addEventListener("change", () => { it.checks[+c.dataset.c] = c.checked; }));
  document.getElementById("prev").addEventListener("click", () => { S.i--; render(); });
  document.getElementById("next").addEventListener("click", next);
  document.getElementById("stop").addEventListener("click", e => {
    if (e.target.dataset.sure) finish(false); else { e.target.dataset.sure = "1"; e.target.textContent = "Conferma"; }
  });
  window.scrollTo(0, 0);
}
function answer(k) {
  const it = S.items[S.i]; if (it.answer != null) return;
  if (it.q.multi) {
    const i = it.sel.indexOf(k);
    if (i >= 0) it.sel.splice(i, 1); else if (it.sel.length < it.q.nOk) it.sel.push(k);
    render(); return;
  }
  it.answer = k;
  record(it);
  render();
}
function confirmMulti() {
  const it = S.items[S.i]; if (it.answer != null || it.sel.length !== it.q.nOk) return;
  it.answer = it.sel.slice();
  record(it);
  render();
}
function record(it) {
  const set = new Set(wrongIds);
  if (isRight(it)) set.delete(it.q.id); else set.add(it.q.id);
  wrongIds = [...set]; store.set("asdq-wrong", wrongIds);
}
function next() { if (S.i < S.items.length - 1) { S.i++; render(); } else finish(false); }

function finish(timeout) {
  clearInterval(tick);
  const mcs = S.items.filter(x => x.kind === "mc"), ops = S.items.filter(x => x.kind === "open");
  const ok = mcs.filter(isRight).length;
  const openScore = ops.reduce((s, x) => s + (x.revealed ? x.checks.filter(Boolean).length / x.q.p.length : 0), 0);
  const openDone = ops.filter(x => x.revealed).length;
  const per = {};
  for (const x of mcs) { const p = (per[x.q.t] ||= { ok: 0, tot: 0 }); p.tot++; if (isRight(x)) p.ok++; }
  const wrong = mcs.filter(x => !isRight(x));
  const pct = mcs.length ? Math.round(ok / mcs.length * 100) : 0;
  history.push({ date: new Date().toLocaleDateString("it-IT"), label: S.label, mc: mcs.length ? `${ok}/${mcs.length}` : "-", open: ops.length ? `${openScore.toFixed(1)}/${ops.length}` : null, ...(S.book ? { book: true } : {}) });
  if (S.book) { for (const [t, p] of Object.entries(per)) chapterStats[t] = p; store.set("asdq-chapters", chapterStats); }
  store.set("asdq-history", history.slice(-30));
  app.innerHTML = `<div class="stack">
    <div><div class="tag">${S.label}${timeout ? " · tempo scaduto" : ""}</div><h1>Risultato</h1></div>
    <div class="card stats">
      ${mcs.length ? `<div class="stat"><b class="big" style="color:${col(ok / mcs.length)}">${pct}%</b><span>${ok} giuste su ${mcs.length} a risposta multipla</span></div>` : ""}
      ${ops.length ? `<div class="stat"><b class="big">${openScore.toFixed(1)}</b><span>punti su ${ops.length} nelle aperte (autovalutazione, ${openDone} corrette)</span></div>` : ""}
      <div class="stat"><b class="big">${wrong.length}</b><span>errori o non risposte (gli errori restano da ripassare)</span></div>
    </div>
    ${mcs.length ? `<div class="card"><h2>Per argomento</h2><div class="topics">${Object.entries(per).sort((a, b) => a[1].ok / a[1].tot - b[1].ok / b[1].tot).map(([t, p]) =>
      `<div class="trow"><span>${LABELS[t]}</span><div class="tbar"><i style="width:${p.ok / p.tot * 100}%;background:${col(p.ok / p.tot)}"></i></div><b>${p.ok}/${p.tot}</b></div>`).join("")}</div>
      <p class="muted" style="margin-bottom:0">${S.book ? "In alto i capitoli più deboli: rileggili e rifalli dalla griglia del tab Libro." : "In alto gli argomenti più deboli: ripassali sul riassunto o con la modalità «un solo argomento»."}</p></div>` : ""}
    ${wrong.length ? `<div class="card"><h2>Le domande sbagliate</h2>${wrong.map(x => `<details class="wrong"><summary>${esc(x.q.q)}</summary>
      <p><b>${x.q.multi ? "Giuste" : "Giusta"}:</b> ${esc(rightText(x))}${x.answer != null ? `<br><span class="muted">Hai risposto: ${esc(chosenText(x))}</span>` : "<br><span class='muted'>Non risposta</span>"}</p><p>${esc(x.q.e)}</p></details>`).join("")}</div>` : ""}
    <div class="row"><button class="primary" id="again">Nuova simulazione</button><button id="home">Torna all'inizio</button></div>
  </div>`;
  document.getElementById("again").addEventListener("click", () => begin(S.mode, S.topic));
  document.getElementById("home").addEventListener("click", startScreen);
  window.scrollTo(0, 0);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

addEventListener("keydown", e => {
  if (!S || !document.getElementById("next")) return;
  if (e.target.tagName === "TEXTAREA") return;
  const it = S.items[S.i];
  if (it.kind === "mc" && it.answer == null && /^[1-9]$/.test(e.key) && +e.key <= it.opts.length) answer(+e.key - 1);
  else if (e.key === "Enter") {
    if (it.kind === "mc" && it.q.multi && it.answer == null) { confirmMulti(); return; }
    const b = document.getElementById("next"); if (!b.disabled) next();
  }
});
startScreen();
</script>
</body>
</html>
